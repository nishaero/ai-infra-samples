apiVersion: v1
kind: ConfigMap
metadata:
  name: climate-config
  namespace: climate-prediction
data:
  aws-region: "us-west-2"
  s3-data-bucket: "climate-prediction-data"
  s3-models-bucket: "climate-prediction-models"
  s3-artifacts-bucket: "climate-prediction-artifacts"
  mlflow-tracking-uri: "http://mlflow-service:5000"
  environment: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: climate-secrets
  namespace: climate-prediction
type: Opaque
data:
  # Base64 encoded values
  database-url: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0BkYi5leGFtcGxlLmNvbTo1NDMyL2FpcmZsb3c=
  aws-access-key-id: ""
  aws-secret-access-key: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: climate-prediction-sa
  namespace: climate-prediction
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/ClimateePredictionRole
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: climate-prediction
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: climate-prediction
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp2