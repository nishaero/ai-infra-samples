apiVersion: v1
kind: ServiceMonitor
metadata:
  name: climate-prediction-api-monitor
  namespace: climate-prediction
  labels:
    app: climate-prediction-api
spec:
  selector:
    matchLabels:
      app: climate-prediction-api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: climate-prediction-alerts
  namespace: climate-prediction
  labels:
    app: climate-prediction
spec:
  groups:
  - name: climate-prediction.rules
    rules:
    - alert: ClimateAPIHighLatency
      expr: histogram_quantile(0.95, sum(rate(model_prediction_latency_seconds_bucket[5m])) by (le)) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Climate Prediction API high latency"
        description: "95th percentile latency is above 1 second for 5 minutes"
    
    - alert: ClimateAPIHighErrorRate
      expr: rate(climate_prediction_errors_total[5m]) > 0.1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Climate Prediction API high error rate"
        description: "Error rate is above 10% for 2 minutes"
    
    - alert: ClimateModelAccuracyDrop
      expr: model_accuracy < 0.7
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Climate model accuracy dropped"
        description: "Model accuracy is below 70% for 10 minutes"
    
    - alert: ClimateDataDriftDetected
      expr: model_data_drift_score > 0.7
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Data drift detected in climate model"
        description: "Data drift score is above 0.7 for 5 minutes"
    
    - alert: ClimateAPIPodDown
      expr: up{job="climate-prediction-api"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Climate Prediction API pod is down"
        description: "Climate Prediction API pod has been down for more than 1 minute"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    name: prometheus
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    name: grafana
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
        - name: prometheus-data
          mountPath: /prometheus
        command:
        - /bin/prometheus
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.console.libraries=/etc/prometheus/console_libraries
        - --web.console.templates=/etc/prometheus/consoles
        - --storage.tsdb.retention.time=200h
        - --web.enable-lifecycle
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-pvc